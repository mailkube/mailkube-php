name: CI

on:
  # No `push: branches: [main]` trigger on purpose. release.yml already runs this entire workflow
  # through `workflow_call` on every push to `main`, and both runs land in the same
  # `ci-${{ github.ref }}` concurrency group with cancel-in-progress. A direct trigger therefore
  # only ever races the gated one: one of the two is cancelled, and the cancelled run is what the
  # README's CI badge reports. `main` stays fully covered by release.yml's ci-gate job.
  pull_request:
  workflow_call: # so release.yml can gate on the full CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.3", "8.4"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: pcov
          tools: composer:v2

      # Publish-readiness: catches a manifest that Packagist would reject, before a tag exists.
      # Deliberately NOT `--no-check-publish`, which suppresses exactly those checks.
      - name: Manifest validation (composer validate)
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Format check (php-cs-fixer)
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Docs + type hints (phpcs)
        run: vendor/bin/phpcs

      - name: Static analysis (phpstan, level max)
        # Level max on a parallel worker can exceed PHP CLI defaults; pin it rather than
        # depending on the runner image.
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Complexity + design (phpmd)
        run: vendor/bin/phpmd src,examples text phpmd.xml

      - name: Tests + coverage
        run: vendor/bin/phpunit --coverage-clover=coverage.clover

      - name: Coverage gate (90% line)
        run: ./scripts/check-coverage.sh coverage.clover

  deps-floor:
    # The `^` constraints in composer.json are a promise to consumers: this job is what makes them
    # true. `composer install` resolves the NEWEST matching versions, so without this the declared
    # lower bounds are never executed by anything.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3" # the declared floor
          coverage: none
          tools: composer:v2

      - name: Install the lowest allowed dependencies
        run: composer update --prefer-lowest --prefer-stable --no-interaction --no-progress

      - name: Tests
        run: vendor/bin/phpunit

  examples:
    # `examples/` is runnable documentation, and customers copy it. Nothing in CI executes it —
    # that would need live credentials — so this is the floor: every example must at least parse.
    # phpcs, phpstan, phpmd and php-cs-fixer (in `test`) cover documentation, typing, complexity
    # and style; this catches what none of them can, a file that is not valid PHP at all.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: Examples parse (php -l)
        # `|| exit 1` is load-bearing: a bare `for … done` reports only the LAST iteration's
        # status, so without it a broken file anywhere but the end would pass silently.
        # The count assertion is the other half — a glob that matched nothing would also pass.
        run: |
          n=$(ls examples/*.php | wc -l)
          test "$n" -ge 13 || { echo "expected >=13 examples, found $n"; exit 1; }
          for f in examples/*.php; do php -l "$f" || exit 1; done

  dry:
    # Language-agnostic duplication (DRY) gate — identical across every mailkube repo.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Copy-paste detection (jscpd)
        run: npx --yes jscpd@4 --config .jscpd.json .
      # Examples are excluded from the run above and measured here instead, at a higher
      # minTokens. Every example repeats the same scaffolding — require the autoloader, read
      # MAILKUBE_FROM, construct the client — and deduping that into a shared helper would defeat
      # the point of a file you can read top to bottom and paste into your own project. 100 tokens
      # is past that boilerplate (the cliff is at 90) while still catching a copy-pasted example.
      - name: Copy-paste detection across examples (jscpd)
        run: npx --yes jscpd@4 --config .jscpd.examples.json examples/

  docs:
    # Governance gate: every .rules/*.md must be indexed in AGENTS.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Rule-index sync check
        run: ./scripts/check-rule-index.sh
